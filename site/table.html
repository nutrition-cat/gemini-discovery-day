<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>プロンプト一覧データテーブル | Gemini Discovery Day by Google AI学生アンバサダー</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;600;700;800&family=Noto+Sans+JP:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #050713;
      --bg-surface: #0a0f24;
      --bg-card: rgba(15, 23, 48, 0.9);
      --border-subtle: rgba(255, 255, 255, 0.1);
      --neon-cyan: #00f0ff;
      --neon-pink: #ff2a85;
      --neon-yellow: #ffe600;
      --neon-green: #00ff88;
      --neon-purple: #b042ff;
      --neon-blue: #2979ff;
      --text-main: #f8fafc;
      --text-sub: #cbd5e1;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', 'Noto Sans JP', sans-serif;
      background: var(--bg-deep);
      color: var(--text-main);
      padding: 32px 24px 80px;
      line-height: 1.6;
    }
    .table-container {
      max-width: 1560px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 2px solid var(--border-subtle);
    }
    h1 {
      font-size: 1.85rem;
      font-weight: 900;
      color: #fff;
    }
    .subtitle {
      font-size: 0.95rem;
      color: var(--neon-cyan);
      font-weight: 700;
      margin-top: 4px;
    }
    .header-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .btn {
      padding: 10px 20px;
      border-radius: 9999px;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .btn-cyan {
      background: rgba(0, 240, 255, 0.15);
      border: 1.5px solid var(--neon-cyan);
      color: var(--neon-cyan);
    }
    .btn-cyan:hover {
      background: var(--neon-cyan);
      color: #050713;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
    }
    .btn-cardview {
      background: rgba(255, 255, 255, 0.1);
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      color: #fff;
    }
    .btn-cardview:hover {
      border-color: #fff;
      transform: translateY(-2px);
    }
    
    /* Toolbar */
    .filter-bar {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 16px 20px;
      margin-bottom: 24px;
      display: flex;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
    }
    .search-box {
      flex: 1;
      min-width: 280px;
    }
    .search-box input {
      width: 100%;
      background: rgba(5, 7, 20, 0.9);
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 12px 18px;
      color: #fff;
      font-size: 1.05rem;
      outline: none;
    }
    .search-box input:focus {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
    }
    .cat-select {
      background: rgba(5, 7, 20, 0.9);
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 12px 16px;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      outline: none;
      cursor: pointer;
    }
    
    /* Table Styling */
    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      background: var(--bg-card);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    thead {
      background: rgba(10, 15, 36, 0.98);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    th {
      padding: 16px 18px;
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--neon-cyan);
      border-bottom: 2px solid rgba(0, 240, 255, 0.3);
      white-space: nowrap;
    }
    td {
      padding: 18px;
      font-size: 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      vertical-align: top;
    }
    tr:hover {
      background: rgba(24, 36, 74, 0.5);
    }
    .id-badge {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      color: var(--neon-cyan);
      font-size: 1.05rem;
      white-space: nowrap;
    }
    .cat-badge {
      font-size: 0.85rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      white-space: nowrap;
    }
    .model-badge {
      font-size: 0.82rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 6px;
      background: rgba(255, 230, 0, 0.12);
      color: var(--neon-yellow);
      border: 1px solid var(--neon-yellow);
      white-space: nowrap;
    }
    .prompt-cell {
      max-width: 480px;
    }
    .prompt-title {
      font-size: 1.15rem;
      font-weight: 900;
      color: #fff;
      margin-bottom: 6px;
    }
    .prompt-aim {
      font-size: 0.95rem;
      color: var(--text-sub);
      margin-bottom: 10px;
    }
    .prompt-code-toggle {
      background: rgba(5, 7, 20, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 10px 14px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.88rem;
      color: var(--text-sub);
      max-height: 120px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .actions-cell {
      display: flex;
      flex-direction: column;
      gap: 8px;
      white-space: nowrap;
    }
    .btn-action-sm {
      padding: 8px 14px;
      font-size: 0.88rem;
      border-radius: 8px;
      font-weight: 800;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-copy-sm {
      background: rgba(0, 255, 136, 0.15);
      color: var(--neon-green);
      border: 1px solid var(--neon-green);
    }
    .btn-copy-sm:hover {
      background: var(--neon-green);
      color: #050713;
    }
    .btn-gemini-sm {
      background: rgba(0, 240, 255, 0.15);
      color: var(--neon-cyan);
      border: 1px solid var(--neon-cyan);
    }
    .btn-gemini-sm:hover {
      background: var(--neon-cyan);
      color: #050713;
    }
    
    /* Toast */
    .toast {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: #090e24;
      border: 2px solid var(--neon-green);
      padding: 14px 24px;
      border-radius: 9999px;
      color: #fff;
      font-weight: 800;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 20px rgba(0, 255, 136, 0.4);
      z-index: 1000;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.3s;
      pointer-events: none;
    }
    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="table-container">
    <header>
      <div>
        <h1>Gemini Discovery Day | プロンプト全一覧データ表</h1>
        <p class="subtitle">Supported by Google AI学生アンバサダー / 2026年最新50選 完全データ一覧</p>
      </div>
      <div class="header-actions">
        <a href="index.html" class="btn btn-cardview">
          <span>🎨 カードギャラリーへ戻る</span>
        </a>
        <a href="../prompts_table.tsv" download="prompts_50.tsv" class="btn btn-cyan">
          <span>📥 TSV (Excel) をダウンロード</span>
        </a>
      </div>
    </header>

    <!-- Toolbar Filters -->
    <div class="filter-bar">
      <div class="search-box">
        <input type="text" id="filter-search" placeholder="キーワード・タイトル・内容で検索... (全50件)">
      </div>
      <div>
        <select id="filter-cat" class="cat-select">
          <option value="すべて">すべてのカテゴリ (50)</option>
        </select>
      </div>
      <div style="font-weight: 800; color: var(--text-sub); margin-left: auto;">
        表示中: <span id="visible-count" style="color: var(--neon-cyan); font-family: 'JetBrains Mono'; font-size: 1.3rem;">50</span> / 50 件
      </div>
    </div>

    <!-- Table -->
    <div class="table-wrap">
      <table id="prompts-table">
        <thead>
          <tr>
            <th>No</th>
            <th>カテゴリ</th>
            <th>プロンプト詳細・本文</th>
            <th>推奨モデル</th>
            <th>出力イメージ (Snippet)</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <!-- Populated by JavaScript -->
        </tbody>
      </table>
    </div>
  </div>

  <div class="toast" id="toast">コピーしました！</div>

  <script src="prompts-data.js"></script>
  <script>
    const prompts = window.PROMPTS_DATA || [];
    const tbody = document.getElementById('table-body');
    const searchInput = document.getElementById('filter-search');
    const catSelect = document.getElementById('filter-cat');
    const countEl = document.getElementById('visible-count');
    const toast = document.getElementById('toast');

    // Populate categories in select
    const cats = ['すべて', ...new Set(prompts.map(p => p.category))];
    catSelect.innerHTML = cats.map(c => {
      const count = c === 'すべて' ? prompts.length : prompts.filter(p => p.category === c).length;
      return `<option value="${c}">${c} (${count})</option>`;
    }).join('');

    function renderTable() {
      const query = searchInput.value.toLowerCase().trim();
      const selectedCat = catSelect.value;

      const filtered = prompts.filter(p => {
        const matchCat = selectedCat === 'すべて' || p.category === selectedCat;
        const matchQuery = !query || 
          p.title.toLowerCase().includes(query) ||
          p.aim.toLowerCase().includes(query) ||
          p.promptTemplate.toLowerCase().includes(query) ||
          p.recommendedModel.toLowerCase().includes(query) ||
          p.category.toLowerCase().includes(query);
        return matchCat && matchQuery;
      });

      countEl.innerText = filtered.length;

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding: 40px; color: var(--text-muted);">該当するプロンプトがありません</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(p => {
        const padId = '#' + String(p.id).padStart(2, '0');
        return `
          <tr data-id="${p.id}">
            <td><span class="id-badge">${padId}</span></td>
            <td><span class="cat-badge">${escapeHtml(p.category)}</span></td>
            <td class="prompt-cell">
              <div class="prompt-title">${escapeHtml(p.title)}</div>
              <div class="prompt-aim">${escapeHtml(p.aim)}</div>
              <div class="prompt-code-toggle">${escapeHtml(p.promptTemplate)}</div>
            </td>
            <td><span class="model-badge">${escapeHtml(p.recommendedModel)}</span></td>
            <td style="max-width: 280px; font-size: 0.92rem; color: var(--text-sub);">
              ${escapeHtml(p.outputSnippet)}
            </td>
            <td>
              <div class="actions-cell">
                <button class="btn-action-sm btn-copy-sm" onclick="copyPrompt(${p.id})">
                  📋 コピー
                </button>
                <button class="btn-action-sm btn-gemini-sm" onclick="launchGemini(${p.id})">
                  🚀 Geminiへ
                </button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    function copyPrompt(id) {
      const p = prompts.find(x => x.id === id);
      if (!p) return;
      navigator.clipboard.writeText(p.promptTemplate).then(() => {
        showToast(`「${p.title}」をコピーしました！`);
      });
    }

    function launchGemini(id) {
      const p = prompts.find(x => x.id === id);
      if (!p) return;
      navigator.clipboard.writeText(p.promptTemplate).then(() => {
        showToast('プロンプトを自動コピーしました！Geminiが開いたら【Ctrl+V】で貼り付けてください');
        setTimeout(() => {
          window.open('https://gemini.google.com/app', '_blank');
        }, 120);
      });
    }

    function showToast(msg) {
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    searchInput.addEventListener('input', renderTable);
    catSelect.addEventListener('change', renderTable);

    renderTable();
  </script>
</body>
</html>
